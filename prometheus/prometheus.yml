# Arquivo principal de configuração do Prometheus
# Referenciado no docker-compose na linha:
#   --config.file=/etc/prometheus/prometheus.yml
# Define de quanto em quanto tempo as métricas são coletadas e quais
# são as ferrementas que serão consultadas para extrair as métricas,
# note que neste arquivo temos as ferramentas(targes): Mysql-exporter,
# CAdvisor. Prometheus
global:
# Intervalo padrão entre as coletas das métricas. A cadas 15s segundos o 
# Prometheus acessa as ferramentas e coleta dados delas
  scrape_interval: 15s
# Intervalo em que o Prometheus avalia as regras de acesso e coleta de dados
  evaluation_interval: 15s

# Área de configuração das ferramentas que fornecem metricas ao prometheus
scrape_configs:
# job_name é o nome que aparece ao selecionar uma query(consulta) relacionada
# a esta ferramenta. 
# target é a ferramenta que será acessada para coletar os dados de metricas
# e passará  ao prometheus
  - job_name: mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
